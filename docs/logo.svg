<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- nflog2syslog: packets through a net filter, out as JSON -->
  <rect width="256" height="256" rx="56" fill="#1c2333"/>
  <!-- packets entering the filter -->
  <circle cx="72" cy="52" r="10" fill="#4fd1c5"/>
  <circle cx="128" cy="42" r="10" fill="#f6c344"/>
  <circle cx="184" cy="52" r="10" fill="#e0655a"/>
  <!-- netfilter funnel -->
  <path d="M40 78 H216 L146 148 H110 Z"
        fill="none" stroke="#f74c00" stroke-width="16" stroke-linejoin="round"/>
  <path d="M78 112 H178 M96 130 H160"
        fill="none" stroke="#f74c00" stroke-width="8" stroke-linecap="round"/>
  <!-- output pipe -->
  <path d="M128 148 v18" stroke="#f74c00" stroke-width="16" stroke-linecap="round"/>
  <!-- JSON output -->
  <text x="128" y="226" font-family="ui-monospace, 'DejaVu Sans Mono', monospace"
        font-size="64" font-weight="bold" fill="#4fd1c5" text-anchor="middle">{ }</text>
</svg>
