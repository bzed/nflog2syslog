name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # release binary for the runner platform (release profile already strips)
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: package the binary
        run: |
          mkdir -p dist
          cp target/release/nflog2syslog dist/
          cd dist
          tar czf "nflog2syslog-${GITHUB_REF_NAME}-x86_64-linux-gnu.tar.gz" nflog2syslog
          rm nflog2syslog
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: dist/
          retention-days: 7

  # Debian package, built against the oldest supported distro toolchain
  deb:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper lintian git ca-certificates curl jq
      - name: install rust via rustup
        # Debian's rustc is older than the dependency set needs (time 0.3.55
        # requires rustc 1.88) and the packaged rustup fails in containers,
        # so use the upstream installer
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          # GITHUB_PATH only takes effect for subsequent steps, so make
          # rustup visible within this one as well
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # pre-install rust-src so a shim run during the build does not
          # decide to fetch missing components (parallel downloads race
          # in ~/.rustup/downloads and fail)
          rustup component add rust-src
          # point the debian/rules CARGO/RUSTC indirections at the real
          # toolchain binaries, not the rustup shims (shims are fragile
          # in sanitized build environments)
          echo "CARGO=$(rustup which cargo)" >> "$GITHUB_ENV"
          echo "RUSTC=$(rustup which rustc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - run: make vendor
      # -d: toolchain comes from rustup, not from Debian packages
      - run: dpkg-buildpackage -us -uc -b -d
      - run: lintian ../nflog2syslog_*.deb
      - name: move artifacts into the workspace
        run: mv ../nflog2syslog_*.deb .
      - uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: nflog2syslog_*.deb
          retention-days: 7

  publish:
    needs: [binary, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "nflog2syslog ${GITHUB_REF_NAME}" \
            --generate-notes
