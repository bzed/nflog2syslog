name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # TESTING.md §1
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  # TESTING.md §1
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings

  # TESTING.md §2: unit + golden tests, with JUnit XML results uploaded
  # to GitHub (test report + PR comment) and kept as an artifact.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: run tests (JUnit XML report)
        run: cargo nextest run --profile ci
      - name: publish test results
        uses: codecov/basic-test-results@v1
        if: always()
        # reporting only: the nextest run itself is the gate, a failing
        # upload (e.g. fork PRs where the token cannot comment) must not
        # break the pipeline
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          disable-search: true
          # nextest resolves the configured junit path inside
          # target/nextest/<profile>/
          file: target/nextest/ci/junit.xml
      - name: keep JUnit report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-results
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # coverage via llvm-cov, uploaded to Codecov
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: run tests with coverage instrumentation
        run: cargo llvm-cov --codecov --output-path coverage.json
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.json
          token: ${{ secrets.CODECOV_TOKEN }}
          # do not break CI when the token is not configured (private
          # repos need CODECOV_TOKEN as a repository secret)
          fail_ci_if_error: false

  # TESTING.md §3: unprivileged run must fail cleanly with EPERM
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: expect a clean EPERM failure (exit 1)
        run: |
          set +e
          out=$(./target/release/nflog2syslog --nflog-group 7 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 1 ]; then
            echo "::error::expected exit code 1, got $rc"
            exit 1
          fi
          echo "$out" | grep -q "Operation not permitted" || {
            echo "::error::expected a kernel NACK (Operation not permitted) on stderr"
            exit 1
          }

  # TESTING.md §4: full kernel round-trip. GitHub runners have
  # passwordless sudo, so the root-only integration test runs here.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: load the nfnetlink_log kernel module
        run: sudo modprobe nfnetlink_log || true
      - name: root integration test
        run: >
          sudo NFLOG2SYSLOG_BIN=$PWD/target/release/nflog2syslog
          bash scripts/root-integration-test.sh

  # TESTING.md §7: Debian package build + lintian in a debian:trixie
  # container. The rust toolchain comes from rustup, not Debian: the
  # dependency set needs rustc >= 1.88 (time 0.3.55) which trixie does
  # not ship.
  packaging:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper lintian git ca-certificates curl
      - name: install rust via rustup
        # Debian's rustc is older than the dependency set needs (time 0.3.55
        # requires rustc 1.88) and the packaged rustup fails in containers,
        # so use the upstream installer
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          # GITHUB_PATH only takes effect for subsequent steps, so make
          # rustup visible within this one as well
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # point the debian/rules CARGO indirection at the real toolchain
          # binary, not the rustup shim (shims are fragile in sanitized
          # build environments)
          echo "CARGO=$(rustup which cargo)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - run: make vendor
      # -d skips the Build-Depends check: the toolchain comes from rustup,
      # not from the Debian packages the control file declares
      - run: dpkg-buildpackage -us -uc -b -d
      - run: lintian ../nflog2syslog_*.deb
      - name: move artifacts into the workspace
        run: mv ../nflog2syslog_*.deb ../nflog2syslog_*.buildinfo ../nflog2syslog_*.changes .
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path:
            nflog2syslog_*.deb
          retention-days: 14
